// 构造近7天打卡数据
function buildCheckins(sleepScores, notes) {
  var checkins = {};
  var today = new Date();
  for (var i = 6; i >= 0; i--) {
    var d = new Date(today);
    d.setDate(d.getDate() - i);
    var key = d.toISOString().slice(0,10);
    var idx = 6 - i;
    checkins[key] = {
      meals: { '早餐': true, '午餐': idx % 2 === 0, '晚餐': true, '睡前食疗': idx % 3 === 0 },
      sleepScore: sleepScores[idx],
      notes: notes[idx] || ''
    };
  }
  return checkins;
}

// ===== 渲染档案列表 =====
function renderProfiles() {
  var html = '';
  MOCK_PROFILES.forEach(function(p) {
    var checkinKeys = Object.keys(p.data.checkins);
    var avgSleep = 0, cnt = 0;
    checkinKeys.forEach(function(k) {
      if (p.data.checkins[k].sleepScore > 0) { avgSleep += p.data.checkins[k].sleepScore; cnt++; }
    });
    avgSleep = cnt > 0 ? (avgSleep/cnt).toFixed(1) : '0';

    html += '<div class="profile-card">';
    html += '<div class="profile-card-header">';
    html += '<div class="profile-seal" style="background:' + p.sealColor + ';">' + p.seal + '</div>';
    html += '<div class="profile-info">';
    html += '<div class="profile-name">' + p.name + '</div>';
    html += '<div class="profile-meta">' + p.meta + ' · ' + p.data.constitution.name + '</div>';
    html += '</div></div>';
    html += '<div class="profile-tags">';
    p.tags.forEach(function(t) {
      html += '<span class="profile-tag ' + t.cls + '">' + t.text + '</span>';
    });
    html += '</div>';
    html += '<div class="profile-desc">' + p.desc + '</div>';
    html += '<div class="profile-data-row">';
    html += '<div class="profile-data-item"><span class="profile-data-label">症状：</span><span class="profile-data-value">' + p.data.symptoms.length + '项</span></div>';
    html += '<div class="profile-data-item"><span class="profile-data-label">近7天均睡眠：</span><span class="profile-data-value">' + avgSleep + '星</span></div>';
    html += '<div class="profile-data-item"><span class="profile-data-label">打卡：</span><span class="profile-data-value">' + checkinKeys.length + '天</span></div>';
    html += '</div>';
    html += '<button class="profile-load-btn" onclick="loadProfile(\'' + p.id + '\')">加载并测试 →</button>';
    html += '</div>';
  });
  document.getElementById('profileList').innerHTML = html;
}

// ===== 加载档案 =====
function loadProfile(id) {
  var profile = MOCK_PROFILES.find(function(p) { return p.id === id; });
  if (!profile) return;
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(profile.data));
    showToast('已加载「' + profile.name + '」，正在跳转...');
    setTimeout(function() {
      window.location.href = 'preview.html';
    }, 800);
  } catch(e) {
    showToast('加载失败：' + e.message);
  }
}

// ===== 清除数据 =====
function clearData() {
  localStorage.removeItem(STORE_KEY);
  showToast('已清除所有数据');
}

// ===== 查看当前数据 =====
function viewCurrentData() {
  var raw = localStorage.getItem(STORE_KEY);
  if (!raw) {
    showToast('当前无数据');
    return;
  }
  try {
    var data = JSON.parse(raw);
    var info = '当前用户：' + (data.user.name || '未命名') + '\n';
    info += '体质：' + (data.constitution ? data.constitution.name : '未诊断') + '\n';
    info += '症状：' + (data.symptoms || []).join('、') + '\n';
    info += '健康关注：' + (data.healthIssues || []).join('、') + '\n';
    info += '登录状态：' + (data.user.isLoggedIn ? '已登录' : '未登录') + '\n';
    info += 'Agent对话：' + ((data.agentConversations || []).length) + '条';
    alert(info);
  } catch(e) {
    showToast('数据解析失败');
  }
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 1800);
}

renderProfiles();
</script>
</body>
</html>
